[package]
name = "wordcraft-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Safe, isolated R and Python execution runner for WordCraft and interactive literate computing"
readme = "README.md"
repository = "https://github.com/batistalucasv/wordcraft-kernel"

[[bin]]
name = "wc-kernel"
path = "src/bin/wc-kernel.rs"

[[bin]]
name = "wc-kernel-supervisor"
path = "src/bin/wc-kernel-supervisor.rs"

[dependencies]
command-group = "5.0.1"
ctrlc = { version = "~3.4.7", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "poll", "process", "signal"] }

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
