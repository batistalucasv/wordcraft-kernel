[package]
name = "wordcraft-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Safe, isolated R and Python execution runner for WordCraft and interactive literate computing"
readme = "README.md"
repository = "https://github.com/batistalucasv/wordcraft-kernel"

[[bin]]
name = "wc-kernel"
path = "src/bin/wc-kernel.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
